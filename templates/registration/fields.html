{% if form.non_field_errors %}<div role="alert" class="auth-error">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}{% if field.name != 'remember_me' %}<div class="mb-3"><label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="auth-help">{{ field.help_text|safe }}</div>{% endif %}{% for error in field.errors %}<p role="alert" class="auth-field-error">{{ error }}</p>{% endfor %}</div>{% endif %}{% endfor %}
