{% if form.non_field_errors %}<div role="alert" style="color: #991b1b;">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}{% if field.name != 'remember_me' %}<div class="mb-3"><label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="auth-help">{{ field.help_text|safe }}</div>{% endif %}{% for error in field.errors %}<p style="color: #991b1b; font-size: .85rem;" role="alert">{{ error }}</p>{% endfor %}</div>{% endif %}{% endfor %}
<style>.auth-card input:not([type=checkbox]):not([type=hidden]) { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font: inherit; background: #f8fafc; } .auth-help { font-size: .78rem; color: #64748b; line-height: 1.5; margin-top: 6px; } .auth-help ul { padding-left: 18px; margin: 6px 0; }</style>
