{% extends 'base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}
{% block content %}
<div class="card auth-card auth-card-wide">
    <h1 class="auth-title">Смена пароля</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% include 'registration/fields.html' %}
        <button type="submit" class="btn btn-primary btn-w100">Сохранить пароль</button>
    </form>
    <a class="cancel-link" href="{% url 'profile' %}">← Вернуться в личный кабинет</a>
</div>
{% endblock %}
