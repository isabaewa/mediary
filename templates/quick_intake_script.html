<script>
(() => {
 const dialog = document.getElementById('quick-dialog');
 const opener = document.querySelector('.quick-open');
 if (dialog && dialog.showModal) {
  opener.addEventListener('click', event => {
   event.preventDefault();
   const field = dialog.querySelector('[name="taken_at"]');
   const current = new Date();
   const localNow = new Date(current.getTime() - current.getTimezoneOffset() * 60000).toISOString().slice(0,16);
   field.max = localNow;
   if (!field.dataset.edited) field.value = localNow;
   dialog.showModal();
  });
  dialog.querySelector('[name="taken_at"]').addEventListener('input', event => { event.target.dataset.edited = 'true'; });
  dialog.querySelector('.quick-close').addEventListener('click', () => dialog.close());
 }
 const form = document.getElementById('quick-form');
 if (!form) return;
 const mode = form.querySelector('[name="mode"]');
 const select = form.querySelector('[name="medication"]');
 const button = document.getElementById('quick-new');
 const updateMode = () => {
  const isNew = mode.value === 'new';
  document.getElementById('quick-existing').hidden = isNew;
  document.getElementById('quick-new-fields').hidden = !isNew;
  button.textContent = isNew ? 'Выбрать из моих лекарств' : '＋ Новое лекарство';
  select.disabled = isNew;
  form.querySelectorAll('[name="name"], [name="dosage"]').forEach(input => { input.disabled = !isNew; input.required = isNew; });
 };
 button.addEventListener('click', () => { mode.value = mode.value === 'new' ? 'existing' : 'new'; updateMode(); (mode.value === 'new' ? form.querySelector('[name="name"]') : select).focus(); });
 const data = JSON.parse(document.getElementById('quick-medication-data').textContent || '[]');
 select.addEventListener('change', () => { document.getElementById('quick-dose').textContent = data.find(item => String(item.id) === select.value)?.dosage || ''; });
 updateMode();
 form.addEventListener('submit', () => { form.querySelector('[type="submit"]').disabled = true; });
})();
</script>
