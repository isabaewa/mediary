{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center" style="max-width: 520px; margin: 0 auto;">
    <div class="col-md-5 text-center">
        <div class="card p-4 shadow-sm bg-white rounded-3">
            <h3 class="h4 fw-bold text-danger mb-3">Удалить запись из дневника?</h3>
            <p class="text-muted mb-4">Вы уверены, что хотите удалить запись самочувствия за <strong>{{ entry.date|date:"d.m.Y" }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100 mb-2" style="margin-bottom: 10px;">Да, удалить</button>
                <a href="{% url 'diary_list' %}" class="btn btn-light w-100">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
