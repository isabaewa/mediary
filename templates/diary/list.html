{% extends 'base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/diary.css' %}">
<link rel="stylesheet" href="{% static 'css/lists.css' %}">
{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center space-bottom-25">
    <h2 class="fw-bold list-title">Дневник самочувствия</h2>
    <a href="{% url 'diary_create' %}" class="btn btn-primary btn-sm">Новая запись</a>
</div>

<p id="diary-list-status" role="status" hidden></p>
<div id="diary-list" tabindex="-1">
    {% include 'diary/list_fragment.html' %}
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/diary-list.js' %}" defer></script>
{% endblock %}
