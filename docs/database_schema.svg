<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="510" viewBox="0 0 1780 510"><rect width="1780" height="510" fill="#f4f7f6"/><g font-family="Arial, sans-serif" fill="#1e293b"><text x="24" y="34" font-size="22">Mediary — схема БД · учебного проекта</text><rect x="24" y="70" width="400" height="290" rx="12" fill="white" stroke="#cbd5e1"/><text x="40" y="104" font-size="19" font-weight="bold">User — аккаунт</text><text x="40" y="142" font-size="15">id · PK</text><text x="40" y="174" font-size="15">username · UNIQUE</text><text x="40" y="206" font-size="15">password · хеш</text><text x="40" y="238" font-size="15">is_active, is_staff</text><text x="40" y="270" font-size="15">Встроенная модель Django</text><rect x="464" y="70" width="400" height="290" rx="12" fill="white" stroke="#cbd5e1"/><text x="480" y="104" font-size="19" font-weight="bold">Medication — препарат</text><text x="480" y="142" font-size="15">id · PK</text><text x="480" y="174" font-size="15">owner_id · FK → User</text><text x="480" y="206" font-size="15">name, purpose, dosage, frequency</text><text x="480" y="238" font-size="15">as_needed, daily_doses</text><text x="480" y="270" font-size="15">scheduled_times · JSON</text><text x="480" y="302" font-size="15">start_date, end_date NULL</text><rect x="904" y="70" width="400" height="290" rx="12" fill="white" stroke="#cbd5e1"/><text x="920" y="104" font-size="19" font-weight="bold">MedicationIntake — приём</text><text x="920" y="142" font-size="15">id · PK</text><text x="920" y="174" font-size="15">medication_id · FK</text><text x="920" y="206" font-size="15">date, slot, scheduled_time NULL</text><text x="920" y="238" font-size="15">taken, taken_at NULL</text><text x="920" y="270" font-size="15">is_extra, reason</text><rect x="1344" y="70" width="400" height="290" rx="12" fill="white" stroke="#cbd5e1"/><text x="1360" y="104" font-size="19" font-weight="bold">HealthEntry — дневник</text><text x="1360" y="142" font-size="15">id · PK</text><text x="1360" y="174" font-size="15">owner_id · FK → User</text><text x="1360" y="206" font-size="15">date, mood, condition</text><text x="1360" y="238" font-size="15">symptoms, note, pain_intensity</text><text x="1360" y="270" font-size="15">UNIQUE(owner_id, date)</text><text x="24" y="405" font-size="17">User 1 → N Medication · User 1 → N HealthEntry</text><text x="24" y="440" font-size="17">Medication 1 → N MedicationIntake · владелец приёма определяется через препарат</text><text x="24" y="475" font-size="15">ForeignKey / CASCADE · Cookie хранит идентификатор сессии, а не записи дневника</text></g></svg>